version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    expose:
      - 5432
    # ports:
    #   - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    restart:
      always

  backend:
    container_name: backend
    build: 
      context: .
      dockerfile: ./dockerfiles/dev/django/Dockerfile
    ports:
      - 8000:8000
    volumes:
      - ./core:/usr/src/app
    working_dir: /usr/src/app
    # command: django-admin startproject core .
    command: python manage.py runserver 0.0.0.0:8000
    # environment:
    #   - DEBUG=True
    env_file:
      - ./envs/dev/django/.env
    restart:
      always
    depends_on:
      - db

  smtp4dev:
    image: docker.arvancloud.ir/rnwood/smtp4dev:v3
    restart: always
    ports:
      - "5000:80"
      - "25:25"
      - "143:143"
    volumes:
      - smtp4dev-data:/smtp4dev
    environment:
      ServerOptions__HostName: smtp4dev


volumes:
  smtp4dev-data: